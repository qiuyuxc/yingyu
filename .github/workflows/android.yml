name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android-notices.py', 'LICENSE', 'NOTICE', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/android-notices.py', 'LICENSE', 'NOTICE', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify dependency notices
        run: |
          cd android
          ./gradlew :app:exportLibraryDefinitions
          cd ..
          python3 scripts/android-notices.py --check
      - name: Build and verify
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yingyu-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
