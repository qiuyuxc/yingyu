name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 tests/production.test.py
      - run: bash -n install.sh tests/install.test.sh
      - run: shellcheck install.sh tests/install.test.sh
      - run: bash tests/install.test.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    env:
      YINGYU_REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v6
      - name: Install with Docker Compose
        env:
          YINGYU_PROJECT_NAME: yingyu-ci
        run: bash install.sh install --dir "$PWD" --domain images.example.test --proxy external --port 18787 --skip-admin
      - name: Verify production container
        run: |
          task_container_id="$(docker compose ps --quiet yingyu)"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18787/api/health
          test "$(docker exec "$task_container_id" id -u)" = 1000
          docker exec "$task_container_id" node -e "fetch('http://127.0.0.1:8787/app/settings').then(async r=>{require('node:assert/strict').equal(r.status,200);require('node:assert/strict').ok((await r.text()).includes('id=\"root\"'))})"
          test "$(docker exec "$task_container_id" node -e "console.log(require('node:fs').existsSync('/app/.env'))")" = false
          docker exec "$task_container_id" sh -c 'test -s /app/LICENSE && test -s /app/NOTICE && test -s /app/THIRD_PARTY_NOTICES.txt'
      - name: Verify persistent data backup
        run: |
          bash install.sh backup --dir "$PWD"
          task_backup_archives=(backups/*/data.tar.gz)
          task_backup_archive="${task_backup_archives[0]}"
          tar -tzf "$task_backup_archive"
          cmp .env "${task_backup_archive%/data.tar.gz}/.env"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18787/api/health
      - name: Container logs
        if: failure()
        run: if test -f .env; then docker compose logs --tail 100; fi
      - name: Stop container
        if: always()
        run: if test -f .env; then docker compose down --volumes --remove-orphans; fi
